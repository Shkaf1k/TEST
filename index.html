<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Верхний бар -->
  <header class="navbar">
    <div class="logo">TikTok</div>
    <div class="auth-bar">
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Пароль">
      <button id="loginBtn" class="btn btn-primary">Войти</button>
      <button id="logoutBtn" class="btn btn-secondary hidden">Выйти</button>
    </div>
  </header>

  <!-- Контейнер для видео -->
  <main class="feed" id="videoContainer">
    <!-- Сда загрузятся карточки -->
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
