<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Dev Hub 🍓</title>
    <style>
        :root {
            --bg-dark: #0a060f;
            --panel-bg: #140b1f;
            --card-bg: #1d102b;
            --accent-pink: #ff2a75;
            --accent-purple: #8b00ff;
            --accent-blue: #478cbf;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #a797be;
            --border: rgba(255, 42, 117, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 65px;
            background: linear-gradient(90deg, #1d0a2d, #0a060f);
            border-bottom: 2px solid var(--accent-pink);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 0 20px rgba(255, 42, 117, 0.3);
            z-index: 10;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .logo span { color: var(--accent-pink); }

        .nav-tabs { display: flex; gap: 10px; }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 90%;
            margin: 25px auto;
        }

        .profile-header {
            position: relative;
            background: var(--panel-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .profile-banner {
            height: 160px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            background-size: cover;
            background-position: center;
        }

        .profile-info {
            padding: 15px 25px 25px 160px;
            position: relative;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--panel-bg);
            background: #251338;
            position: absolute;
            top: -55px;
            left: 25px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .profile-name { font-size: 1.5rem; margin: 0; }
        .profile-bio { color: var(--text-muted); margin: 5px 0 0 0; font-size: 0.95rem; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 42, 117, 0.3);
        }

        .game-cover {
            height: 150px;
            background: #11081a;
            object-fit: cover;
            width: 100%;
        }

        .game-body {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title { margin: 0 0 8px 0; font-size: 1.2rem; color: #fff; }
        .game-desc { color: var(--text-muted); font-size: 0.9rem; flex: 1; margin-bottom: 15px; }
        .game-author { font-size: 0.8rem; color: var(--accent-pink); margin-bottom: 10px; }

        .card-panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #3d1e56;
            background: #0d0614;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* Стильные инпуты для файлов */
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px dashed var(--accent-pink);
            background: #0d0614;
            color: var(--text-muted);
            cursor: pointer;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button.btn-primary:hover { box-shadow: 0 0 15px var(--accent-pink); }

        a.btn-download {
            display: block;
            text-align: center;
            background: var(--accent-blue);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        a.btn-download:hover { background: #3573a1; }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 6, 15, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .auth-card {
            width: 380px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 30px rgba(255, 42, 117, 0.3);
        }

        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #281438; border: 1px solid var(--accent-pink); color: #fff; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--accent-pink); }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍓 Godot <span>DevHub</span></div>
        <div class="nav-tabs" id="nav-tabs" style="display: none;">
            <button class="nav-btn active" onclick="showTab('feed')">🎮 Игры</button>
            <button class="nav-btn" onclick="showTab('publish')">➕ Опубликовать</button>
            <button class="nav-btn" onclick="showTab('profile')">👤 Мой Профиль</button>
            <button class="nav-btn" style="color: #ff4444;" onclick="handleLogout()">Выход</button>
        </div>
    </header>

    <div id="auth-overlay">
        <div class="auth-card">
            <div class="tab-buttons">
                <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
                <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <div id="form-login">
                <input type="email" id="login-email" placeholder="Email...">
                <input type="password" id="login-password" placeholder="Пароль...">
                <button class="btn-primary" onclick="handleLogin()">Войти</button>
            </div>

            <div id="form-register" style="display: none;">
                <input type="text" id="reg-username" placeholder="Игровой Ник...">
                <input type="email" id="reg-email" placeholder="Email...">
                <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)...">
                <button class="btn-primary" onclick="handleRegister()">Зарегистрироваться</button>
            </div>
        </div>
    </div>

    <main>
        <!-- Вкладка 1: Игры -->
        <section id="section-feed">
            <h2 style="color: var(--accent-pink);">🔥 Игры сообщества Godot</h2>
            <div class="games-grid" id="games-container">
                <p style="color: var(--text-muted);">Загрузка проектов...</p>
            </div>
        </section>

        <!-- Вкладка 2: Публикация Игры -->
        <section id="section-publish" style="display: none;">
            <div class="card-panel">
                <h2 style="color: var(--accent-pink); margin-top: 0;">🚀 Опубликовать игру</h2>
                
                <label>Название игры:</label>
                <input type="text" id="game-title" placeholder="Мой крутой проект на Godot">

                <label>Обложка игры (с ПК):</label>
                <input type="file" id="game-cover-file" accept="image/*">

                <label>Файл игры / Архив (с ПК, до 10MB) или ссылка:</label>
                <input type="file" id="game-file">

                <label>Описание:</label>
                <textarea id="game-desc" rows="4" placeholder="Описание, управление и возможности..."></textarea>

                <button class="btn-primary" id="pub-btn" onclick="publishGame()">Загрузить игру 🍓</button>
            </div>
        </section>

        <!-- Вкладка 3: Профиль -->
        <section id="section-profile" style="display: none;">
            <div class="profile-header">
                <div class="profile-banner" id="view-banner"></div>
                <div class="profile-info">
                    <img src="https://via.placeholder.com/110" id="view-avatar" class="profile-avatar" alt="Avatar">
                    <h2 class="profile-name" id="view-username">Никнейм</h2>
                    <p class="profile-bio" id="view-bio">Описание профиля не заполнено.</p>
                </div>
            </div>

            <div class="card-panel">
                <h3 style="color: var(--accent-pink); margin-top: 0;">⚙️ Редактировать профиль</h3>
                
                <label>Загрузить Аватарку с компьютера:</label>
                <input type="file" id="edit-avatar-file" accept="image/*">
                
                <label>Загрузить Баннер с компьютера:</label>
                <input type="file" id="edit-banner-file" accept="image/*">
                
                <label>О себе / Статус:</label>
                <textarea id="edit-bio" rows="3" placeholder="Делаю игры на Godot 4..."></textarea>
                
                <button class="btn-primary" id="save-prof-btn" onclick="saveProfile()">Сохранить профиль</button>
            </div>
        </section>
    </main>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAG7dEtpPt6oHoMz5MlFR6aNR7phK95MWk",
            authDomain: "sayt-dlya-druzey.firebaseapp.com",
            databaseURL: "https://sayt-dlya-druzey-default-rtdb.firebaseio.com",
            projectId: "sayt-dlya-druzey",
            storageBucket: "sayt-dlya-druzey.firebasestorage.app",
            messagingSenderId: "498949269925",
            appId: "1:498949269925:web:9f58b3d957921b3cd6e04c",
            measurementId: "G-L8F5K30H3C"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentAvatarBase64 = '';
        let currentBannerBase64 = '';

        function switchAuthTab(type) {
            if (type === 'login') {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
            } else {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-register').style.display = 'block';
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }

        function showTab(tabName) {
            document.getElementById('section-feed').style.display = tabName === 'feed' ? 'block' : 'none';
            document.getElementById('section-publish').style.display = tabName === 'publish' ? 'block' : 'none';
            document.getElementById('section-profile').style.display = tabName === 'profile' ? 'block' : 'none';

            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (event) event.target.classList.add('active');
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('nav-tabs').style.display = 'flex';
                loadUserProfile(user.uid, user.displayName);
                loadGames();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('nav-tabs').style.display = 'none';
            }
        });

        function handleRegister() {
            const nick = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-password').value;

            if (!nick || !email || !pass) return alert("Заполни все поля!");

            auth.createUserWithEmailAndPassword(email, pass)
                .then((cred) => cred.user.updateProfile({ displayName: nick }))
                .then(() => {
                    const uid = auth.currentUser.uid;
                    db.ref('users/' + uid).set({
                        username: nick,
                        avatar: '',
                        banner: '',
                        bio: 'Разработчик на Godot Engine 🎮'
                    });
                })
                .catch(err => alert("Ошибка: " + err.message));
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            if (!email || !pass) return alert("Заполни email и пароль!");

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => alert("Ошибка входа: " + err.message));
        }

        function handleLogout() { auth.signOut(); }

        // Чтение файла как Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function loadUserProfile(uid, defaultName) {
            db.ref('users/' + uid).on('value', (snapshot) => {
                const data = snapshot.val() || {};
                document.getElementById('view-username').innerText = data.username || defaultName || 'Dev';
                document.getElementById('view-bio').innerText = data.bio || 'Нет описания.';
                
                currentAvatarBase64 = data.avatar || '';
                currentBannerBase64 = data.banner || '';

                document.getElementById('view-avatar').src = data.avatar || 'https://via.placeholder.com/110';
                if (data.banner) {
                    document.getElementById('view-banner').style.backgroundImage = `url('${data.banner}')`;
                }
                document.getElementById('edit-bio').value = data.bio || '';
            });
        }

        // Сохранение Профиля
        async function saveProfile() {
            const user = auth.currentUser;
            if (!user) return;

            const saveBtn = document.getElementById('save-prof-btn');
            saveBtn.innerText = "Сохранение...";

            const avatarFile = document.getElementById('edit-avatar-file').files[0];
            const bannerFile = document.getElementById('edit-banner-file').files[0];
            const bio = document.getElementById('edit-bio').value.trim();

            if (avatarFile) currentAvatarBase64 = await fileToBase64(avatarFile);
            if (bannerFile) currentBannerBase64 = await fileToBase64(bannerFile);

            db.ref('users/' + user.uid).update({
                avatar: currentAvatarBase64,
                banner: currentBannerBase64,
                bio: bio
            }).then(() => {
                alert("Профиль успешно обновлён! 🍓");
                saveBtn.innerText = "Сохранить профиль";
            });
        }

        // Публикация Игры
        async function publishGame() {
            const user = auth.currentUser;
            if (!user) return;

            const title = document.getElementById('game-title').value.trim();
            const coverFile = document.getElementById('game-cover-file').files[0];
            const gameFile = document.getElementById('game-file').files[0];
            const desc = document.getElementById('game-desc').value.trim();

            if (!title) return alert("Введи название игры!");

            const pubBtn = document.getElementById('pub-btn');
            pubBtn.innerText = "Публикация...";

            let coverBase64 = 'https://via.placeholder.com/400x200';
            let fileData = '#';

            if (coverFile) coverBase64 = await fileToBase64(coverFile);
            if (gameFile) fileData = await fileToBase64(gameFile);

            db.ref('games').push({
                title: title,
                cover: coverBase64,
                download: fileData,
                fileName: gameFile ? gameFile.name : 'game.zip',
                desc: desc,
                author: user.displayName || 'Godot Dev',
                authorUid: user.uid,
                timestamp: Date.now()
            }).then(() => {
                alert("Игра загружена! 🎉");
                pubBtn.innerText = "Загрузить игру 🍓";
                document.getElementById('game-title').value = '';
                document.getElementById('game-desc').value = '';
                showTab('feed');
            });
        }

        function loadGames() {
            const container = document.getElementById('games-container');
            db.ref('games').on('value', (snapshot) => {
                container.innerHTML = '';
                const games = snapshot.val();
                
                if (!games) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Пока нет игр. Будь первым!</p>';
                    return;
                }

                Object.values(games).reverse().forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${escapeHtml(game.cover)}" class="game-cover" alt="${escapeHtml(game.title)}">
                        <div class="game-body">
                            <h3 class="game-title">${escapeHtml(game.title)}</h3>
                            <div class="game-author">Автор: ${escapeHtml(game.author)}</div>
                            <p class="game-desc">${escapeHtml(game.desc)}</p>
                            <a href="${escapeHtml(game.download)}" download="${escapeHtml(game.fileName || 'game')}" class="btn-download">💾 Скачать файл</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
