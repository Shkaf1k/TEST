<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokTok</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Навигационная панель -->
  <header class="navbar">
    <div class="logo">TokTok</div>
    <div class="auth-bar">
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Пароль">
      <button id="loginBtn" class="btn btn-primary">Войти</button>
      <button id="profileBtn" class="btn btn-secondary hidden">Профиль</button>
      <button id="logoutBtn" class="btn btn-secondary hidden">Выйти</button>
    </div>
  </header>

  <!-- Модальное окно профиля -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeProfile" class="close">&times;</span>
      
      <div class="profile-header">
        <img id="profileAvatar" src="https://via.placeholder.com/100" class="profile-avatar" alt="Avatar">
        <h2 id="profileUsername">Имя пользователя</h2>
        <p id="profileBio" class="profile-bio">Описание профиля отсутствует...</p>
      </div>
      
      <div class="profile-stats">
        <div class="stat-item">
          <span id="followingCount" class="stat-num">0</span>
          <span class="stat-label">Подписки</span>
        </div>
        <div class="stat-item">
          <span id="followersCount" class="stat-num">0</span>
          <span class="stat-label">Подписчики</span>
        </div>
        <div class="stat-item">
          <span id="likesCount" class="stat-num">0</span>
          <span class="stat-label">Лайки</span>
        </div>
      </div>

      <button id="editProfileBtn" class="btn btn-secondary full-width hidden">Изменить профиль</button>
      <button id="followBtn" class="btn btn-primary full-width hidden">Подписаться</button>

      <!-- Форма редактирования -->
      <div id="editForm" class="edit-form hidden">
        <input type="text" id="editAvatarUrl" placeholder="Ссылка на аватарку (URL)">
        <textarea id="editBioInput" placeholder="Описание профиля (био)"></textarea>
        <button id="saveProfileBtn" class="btn btn-primary full-width">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Лента видео -->
  <main class="feed" id="videoContainer"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
