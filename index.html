<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Dev Hub</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1a1a1a;
            --card-bg: #1e1e1e;
            --accent-red: #ff3b3b;
            --border-color: #2e2e2e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo { 
            font-size: 1.2rem; 
            font-weight: bold; 
            letter-spacing: 1px;
            color: #fff; 
        }

        .nav-tabs { display: flex; gap: 15px; }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: #2a2a2a;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: #ffffff;
        }

        /* Карточки игр (в точности как на скрине) */
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            max-width: 500px;
            padding: 25px 20px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .game-card:hover {
            border-color: #444;
        }

        .game-cover {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .game-title { 
            font-size: 1.15rem; 
            font-weight: bold; 
            margin: 0 0 10px 0; 
            color: #ffffff;
        }

        .game-desc { 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            line-height: 1.4;
            margin-bottom: 15px; 
        }

        .game-author { 
            font-size: 0.75rem; 
            color: #777; 
            margin-bottom: 12px; 
        }

        a.btn-download-link {
            color: var(--accent-red);
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        a.btn-download-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Профиль */
        .profile-header {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .profile-banner {
            height: 140px;
            background: #222;
            background-size: cover;
            background-position: center;
        }

        .profile-info {
            padding: 15px 20px 20px 140px;
            position: relative;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--panel-bg);
            background: #252525;
            position: absolute;
            top: -45px;
            left: 20px;
            object-fit: cover;
        }

        .profile-name { font-size: 1.3rem; margin: 0; }
        .profile-bio { color: var(--text-muted); margin: 6px 0 0 0; font-size: 0.85rem; }

        /* Панели форм */
        .card-panel {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #121212;
            color: #fff;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus {
            border-color: #555;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px dashed var(--border-color);
            background: #121212;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }

        button.btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent-red);
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        button.btn-primary:hover { opacity: 0.9; }

        /* Модалка авторизации */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .auth-card {
            width: 350px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            padding: 8px; 
            background: #121212; 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .tab-btn.active { color: #fff; border-color: var(--accent-red); background: #222; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍓 GODOT DEVHUB</div>
        <div class="nav-tabs" id="nav-tabs" style="display: none;">
            <button class="nav-btn active" onclick="showTab('feed')">Иигры</button>
            <button class="nav-btn" onclick="showTab('publish')">+ Опубликовать</button>
            <button class="nav-btn" onclick="showTab('profile')">Мой Профиль</button>
            <button class="nav-btn" style="color: #ff5555;" onclick="handleLogout()">Выход</button>
        </div>
    </header>

    <div id="auth-overlay">
        <div class="auth-card">
            <div class="tab-buttons">
                <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
                <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <div id="form-login">
                <input type="email" id="login-email" placeholder="Email...">
                <input type="password" id="login-password" placeholder="Пароль...">
                <button class="btn-primary" onclick="handleLogin()">Войти</button>
            </div>

            <div id="form-register" style="display: none;">
                <input type="text" id="reg-username" placeholder="Игровой Ник...">
                <input type="email" id="reg-email" placeholder="Email...">
                <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)...">
                <button class="btn-primary" onclick="handleRegister()">Зарегистрироваться</button>
            </div>
        </div>
    </div>

    <main>
        <!-- Вкладка 1: Игры -->
        <section id="section-feed">
            <h2 class="section-title">МОИ ИГРЫ</h2>
            <div class="games-grid" id="games-container">
                <p style="color: var(--text-muted);">Загрузка проектов...</p>
            </div>
        </section>

        <!-- Вкладка 2: Публикация Игры -->
        <section id="section-publish" style="display: none;">
            <div class="card-panel">
                <h2 class="section-title" style="margin-bottom: 20px;">Опубликовать игру</h2>
                
                <label>Название игры:</label>
                <input type="text" id="game-title" placeholder="Название игры">

                <label>Обложка (необязательно, файл с ПК):</label>
                <input type="file" id="game-cover-file" accept="image/*">

                <label>Файл игры / Архив (с ПК):</label>
                <input type="file" id="game-file">

                <label>Краткое описание:</label>
                <textarea id="game-desc" rows="3" placeholder="Краткое описание вашей игры на Godot."></textarea>

                <button class="btn-primary" id="pub-btn" onclick="publishGame()">Загрузить игру</button>
            </div>
        </section>

        <!-- Вкладка 3: Профиль -->
        <section id="section-profile" style="display: none;">
            <div class="profile-header">
                <div class="profile-banner" id="view-banner"></div>
                <div class="profile-info">
                    <img src="https://via.placeholder.com/90" id="view-avatar" class="profile-avatar" alt="Avatar">
                    <h2 class="profile-name" id="view-username">Никнейм</h2>
                    <p class="profile-bio" id="view-bio">Описание профиля не заполнено.</p>
                </div>
            </div>

            <div class="card-panel">
                <h3 style="color: #fff; margin-top: 0; font-size: 1rem; margin-bottom: 20px;">Редактировать профиль</h3>
                
                <label>Загрузить Аватарку с ПК:</label>
                <input type="file" id="edit-avatar-file" accept="image/*">
                
                <label>Загрузить Баннер с ПК:</label>
                <input type="file" id="edit-banner-file" accept="image/*">
                
                <label>О себе / Статус:</label>
                <textarea id="edit-bio" rows="3" placeholder="Разработчик игр на Godot..."></textarea>
                
                <button class="btn-primary" id="save-prof-btn" onclick="saveProfile()">Сохранить профиль</button>
            </div>
        </section>
    </main>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAG7dEtpPt6oHoMz5MlFR6aNR7phK95MWk",
            authDomain: "sayt-dlya-druzey.firebaseapp.com",
            databaseURL: "https://sayt-dlya-druzey-default-rtdb.firebaseio.com",
            projectId: "sayt-dlya-druzey",
            storageBucket: "sayt-dlya-druzey.firebasestorage.app",
            messagingSenderId: "498949269925",
            appId: "1:498949269925:web:9f58b3d957921b3cd6e04c",
            measurementId: "G-L8F5K30H3C"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentAvatarBase64 = '';
        let currentBannerBase64 = '';

        function switchAuthTab(type) {
            if (type === 'login') {
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
            } else {
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-register').style.display = 'block';
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }

        function showTab(tabName) {
            document.getElementById('section-feed').style.display = tabName === 'feed' ? 'block' : 'none';
            document.getElementById('section-publish').style.display = tabName === 'publish' ? 'block' : 'none';
            document.getElementById('section-profile').style.display = tabName === 'profile' ? 'block' : 'none';

            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (event) event.target.classList.add('active');
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('nav-tabs').style.display = 'flex';
                loadUserProfile(user.uid, user.displayName);
                loadGames();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('nav-tabs').style.display = 'none';
            }
        });

        function handleRegister() {
            const nick = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-password').value;

            if (!nick || !email || !pass) return alert("Заполни все поля!");

            auth.createUserWithEmailAndPassword(email, pass)
                .then((cred) => cred.user.updateProfile({ displayName: nick }))
                .then(() => {
                    const uid = auth.currentUser.uid;
                    db.ref('users/' + uid).set({
                        username: nick,
                        avatar: '',
                        banner: '',
                        bio: 'Разработчик на Godot Engine 🎮'
                    });
                })
                .catch(err => alert("Ошибка: " + err.message));
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            if (!email || !pass) return alert("Заполни email и пароль!");

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => alert("Ошибка входа: " + err.message));
        }

        function handleLogout() { auth.signOut(); }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function loadUserProfile(uid, defaultName) {
            db.ref('users/' + uid).on('value', (snapshot) => {
                const data = snapshot.val() || {};
                document.getElementById('view-username').innerText = data.username || defaultName || 'Dev';
                document.getElementById('view-bio').innerText = data.bio || 'Нет описания.';
                
                currentAvatarBase64 = data.avatar || '';
                currentBannerBase64 = data.banner || '';

                document.getElementById('view-avatar').src = data.avatar || 'https://via.placeholder.com/90';
                if (data.banner) {
                    document.getElementById('view-banner').style.backgroundImage = `url('${data.banner}')`;
                }
                document.getElementById('edit-bio').value = data.bio || '';
            });
        }

        async function saveProfile() {
            const user = auth.currentUser;
            if (!user) return;

            const saveBtn = document.getElementById('save-prof-btn');
            saveBtn.innerText = "Сохранение...";

            const avatarFile = document.getElementById('edit-avatar-file').files[0];
            const bannerFile = document.getElementById('edit-banner-file').files[0];
            const bio = document.getElementById('edit-bio').value.trim();

            if (avatarFile) currentAvatarBase64 = await fileToBase64(avatarFile);
            if (bannerFile) currentBannerBase64 = await fileToBase64(bannerFile);

            db.ref('users/' + user.uid).update({
                avatar: currentAvatarBase64,
                banner: currentBannerBase64,
                bio: bio
            }).then(() => {
                alert("Профиль обновлён!");
                saveBtn.innerText = "Сохранить профиль";
            });
        }

        async function publishGame() {
            const user = auth.currentUser;
            if (!user) return;

            const title = document.getElementById('game-title').value.trim();
            const coverFile = document.getElementById('game-cover-file').files[0];
            const gameFile = document.getElementById('game-file').files[0];
            const desc = document.getElementById('game-desc').value.trim();

            if (!title) return alert("Введи название игры!");

            const pubBtn = document.getElementById('pub-btn');
            pubBtn.innerText = "Загрузка...";

            let coverBase64 = '';
            let fileData = '#';

            if (coverFile) coverBase64 = await fileToBase64(coverFile);
            if (gameFile) fileData = await fileToBase64(gameFile);

            db.ref('games').push({
                title: title,
                cover: coverBase64,
                download: fileData,
                fileName: gameFile ? gameFile.name : 'game.zip',
                desc: desc || 'Краткое описание вашей игры на Godot.',
                author: user.displayName || 'Godot Dev',
                authorUid: user.uid,
                timestamp: Date.now()
            }).then(() => {
                alert("Игра загружена!");
                pubBtn.innerText = "Загрузить игру";
                document.getElementById('game-title').value = '';
                document.getElementById('game-desc').value = '';
                showTab('feed');
            });
        }

        function loadGames() {
            const container = document.getElementById('games-container');
            db.ref('games').on('value', (snapshot) => {
                container.innerHTML = '';
                const games = snapshot.val();
                
                if (!games) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Пока нет игр. Будь первым!</p>';
                    return;
                }

                Object.values(games).reverse().forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    
                    const coverHtml = game.cover ? `<img src="${escapeHtml(game.cover)}" class="game-cover" alt="Cover">` : '';
                    
                    card.innerHTML = `
                        ${coverHtml}
                        <h3 class="game-title">${escapeHtml(game.title)}</h3>
                        <div class="game-author">Автор: ${escapeHtml(game.author)}</div>
                        <p class="game-desc">${escapeHtml(game.desc)}</p>
                        <a href="${escapeHtml(game.download)}" download="${escapeHtml(game.fileName || 'game')}" class="btn-download-link">Играть / Скачать</a>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
