<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Godot Dev Hub</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --panel-bg: rgba(18, 20, 29, 0.75);
            --card-bg: rgba(24, 27, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b5c;
            --accent-red-glow: rgba(255, 59, 92, 0.35);
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 15% 15%, rgba(255, 59, 92, 0.08) 0px, transparent 45%),
                radial-gradient(at 85% 85%, rgba(59, 130, 246, 0.08) 0px, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- TOAST NOTIFICATIONS --- */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            background: rgba(24, 27, 38, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.88rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 320px;
        }

        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--accent-red); }
        .toast.info { border-left: 4px solid var(--accent-blue); }

        @keyframes toastIn {
            from { transform: translateY(20px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* --- HEADER --- */
        header {
            min-height: 65px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo { 
            font-size: 1.15rem; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            color: #fff;
            text-shadow: 0 0 12px var(--accent-red-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .nav-btn:hover { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.05); 
        }

        .nav-btn.active { 
            color: #fff; 
            background: rgba(255, 59, 92, 0.15);
            border-color: rgba(255, 59, 92, 0.4);
            box-shadow: 0 0 14px var(--accent-red-glow);
        }

        #global-announcement {
            background: linear-gradient(90deg, rgba(255, 59, 92, 0.25), rgba(139, 92, 246, 0.25));
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 59, 92, 0.3);
            color: #fff;
            text-align: center;
            padding: 10px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            display: none;
            word-break: break-word;
        }

        main {
            flex: 1;
            max-width: 920px;
            width: 100%;
            margin: 25px auto;
            padding: 0 16px;
        }

        .section-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- SEARCH & FILTERS --- */
        .search-bar-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-bar-container input {
            margin-bottom: 0 !important;
        }

        /* --- GAME CARDS --- */
        .games-grid { display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: cardFadeIn 0.4s ease forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-card:hover { 
            border-color: rgba(255, 255, 255, 0.25); 
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.45);
        }

        .game-cover-wrapper {
            position: relative;
            width: 100%;
            max-height: 240px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
        }

        .game-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .game-card:hover .game-cover {
            transform: scale(1.03);
        }

        .game-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; color: #ffffff; word-break: break-word; }
        .game-desc { color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 16px; word-break: break-word; }

        .game-author { 
            font-size: 0.8rem; 
            color: #999; 
            margin-bottom: 14px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-actions { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }

        a.btn-download-link {
            background: linear-gradient(135deg, var(--accent-red) 0%, #d92644 100%);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px var(--accent-red-glow);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        a.btn-download-link:hover { 
            transform: scale(1.03); 
            box-shadow: 0 6px 20px var(--accent-red-glow);
        }

        /* --- PROFILES & PANELS --- */
        .card-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 22px 18px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            max-width: 750px;
            margin: 0 auto 20px auto;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        label { display: block; color: var(--text-muted); font-size: 0.82rem; font-weight: 600; margin-bottom: 8px; }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(13, 14, 18, 0.6);
            color: #fff;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus {
            border-color: rgba(255, 59, 92, 0.5);
            box-shadow: 0 0 10px var(--accent-red-glow);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-red) 0%, #d92644 100%);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px var(--accent-red-glow);
        }

        button.btn-primary:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--accent-red-glow);
        }

        /* --- FOLLOW SYSTEM --- */
        .follow-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #fff;
            font-size: 0.68rem;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .follow-btn:hover {
            background: rgba(255, 59, 92, 0.2);
            border-color: rgba(255, 59, 92, 0.4);
        }

        .scroll-top-btn {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-red) 0%, #d92644 100%);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-red-glow);
            z-index: 900;
            transition: transform 0.2s ease;
        }

        .scroll-top-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <div class="logo">⚡ Godot Dev Hub</div>
        <nav class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('games')">Игры</button>
            <button class="nav-btn" onclick="switchTab('upload')">Опубликовать</button>
            <button class="nav-btn" onclick="switchTab('profile')">Профиль</button>
        </nav>
    </header>

    <div id="global-announcement">
        🚀 Добро пожаловать на Godot Dev Hub! Делитесь своими проектами и находите единомышленников.
    </div>

    <main>
        <!-- Секция Проектов -->
        <section id="section-games">
            <div class="section-title">Каталог Проектов</div>
            
            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Поиск по названию или автору..." onkeyup="filterGames()">
                <button class="search-clear-btn" onclick="clearSearch()">Очистить</button>
            </div>

            <div class="games-grid" id="games-list">
                <!-- Карточки игр динамически подгружаются здесь -->
                <div class="game-card">
                    <div class="game-cover-wrapper">
                        <img class="game-cover" src="https://via.placeholder.com/520x240/181b26/ffffff?text=Godot+Project" alt="Cover">
                    </div>
                    <div class="game-title">Cyber Samurai 2D</div>
                    <div class="game-author">
                        Автор: AlexDev <button class="follow-btn">+ Читать</button>
                    </div>
                    <div class="game-desc">Захватывающий 2D-платформер в стиле киберпанк, разработанный на Godot Engine 4.</div>
                    <div class="card-actions">
                        <a href="#" class="btn-download-link">Скачать Проект</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Секция Загрузки -->
        <section id="section-upload" style="display: none;">
            <div class="section-title">Публикация Игры</div>
            <div class="card-panel">
                <form id="upload-form" onsubmit="handleUpload(event)">
                    <label for="game-title-input">Название проекта</label>
                    <input type="text" id="game-title-input" required placeholder="Моя игра на Godot">

                    <label for="game-desc-input">Описание</label>
                    <textarea id="game-desc-input" rows="4" required placeholder="Опишите геймплей и особенности..."></textarea>

                    <label for="game-file-input">Ссылка на скачивание (ZIP / Executable)</label>
                    <input type="text" id="game-file-input" required placeholder="https://drive.google.com/...">

                    <button type="submit" class="btn-primary">Опубликовать Проект</button>
                </form>
            </div>
        </section>

        <!-- Секция Профиля -->
        <section id="section-profile" style="display: none;">
            <div class="section-title">Профиль Разработчика</div>
            <div class="card-panel">
                <label>Имя пользователя</label>
                <input type="text" value="GodotDeveloper" id="profile-name">

                <label>О себе</label>
                <textarea id="profile-bio" rows="3">Инди-разработчик игр на Godot Engine.</textarea>

                <button class="btn-primary" onclick="saveProfile()">Сохранить Профиль</button>
            </div>
        </section>
    </main>

    <button class="scroll-top-btn" onclick="scrollToTop()">↑</button>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function switchTab(tabName) {
            document.getElementById('section-games').style.display = tabName === 'games' ? 'block' : 'none';
            document.getElementById('section-upload').style.display = tabName === 'upload' ? 'block' : 'none';
            document.getElementById('section-profile').style.display = tabName === 'profile' ? 'block' : 'none';

            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function filterGames() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const title = card.querySelector('.game-title').innerText.toLowerCase();
                const author = card.querySelector('.game-author').innerText.toLowerCase();
                if (title.includes(query) || author.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            filterGames();
        }

        function handleUpload(e) {
            e.preventDefault();
            showToast('Проект успешно опубликован!', 'success');
            document.getElementById('upload-form').reset();
            switchTab('games');
        }

        function saveProfile() {
            showToast('Профиль сохранен', 'success');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
