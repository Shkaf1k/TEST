<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Godot Dev Hub</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --panel-bg: rgba(18, 20, 29, 0.75);
            --card-bg: rgba(24, 27, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b5c;
            --accent-red-glow: rgba(255, 59, 92, 0.35);
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 15% 15%, rgba(255, 59, 92, 0.08) 0px, transparent 45%),
                radial-gradient(at 85% 85%, rgba(59, 130, 246, 0.08) 0px, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            min-height: 65px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
        }

        .logo { 
            font-size: 1.15rem; 
            font-weight: 800; 
            color: #fff;
        }

        main {
            flex: 1;
            max-width: 920px;
            width: 100%;
            margin: 25px auto;
            padding: 0 16px;
        }

        .card-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 22px 18px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            max-width: 750px;
            margin: 0 auto 20px auto;
            width: 100%;
        }

        label { display: block; color: var(--text-muted); font-size: 0.82rem; font-weight: 600; margin-bottom: 8px; }

        input[type="text"], textarea {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(13, 14, 18, 0.6);
            color: #fff;
            outline: none;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: rgba(13, 14, 18, 0.4);
            color: var(--text-muted);
            cursor: pointer;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-red) 0%, #d92644 100%);
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .games-grid { display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; margin-top: 20px; }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            text-align: center;
        }

        a.btn-download-link {
            background: linear-gradient(135deg, var(--accent-red) 0%, #d92644 100%);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Godot Dev Hub</div>
    </header>

    <main>
        <!-- ФОРМА ЗАГРУЗКИ ИГРЫ -->
        <div class="card-panel">
            <h2>Опубликовать игру</h2>
            <form id="upload-form">
                <label for="game-title">Название игры:</label>
                <input type="text" id="game-title" required placeholder="Введите название...">

                <label for="game-desc">Описание:</label>
                <textarea id="game-desc" rows="3" required placeholder="Опишите игру..."></textarea>

                <label for="game-file">Файл игры (.zip / .exe / .apk):</label>
                <input type="file" id="game-file" required>

                <button type="submit" class="btn-primary">Загрузить игру</button>
            </form>
        </div>

        <!-- СПИСОК ЗАГРУЖЕННЫХ ИГР -->
        <div class="games-grid" id="games-container">
            <!-- Сюда динамически добавляются карточки игр -->
        </div>
    </main>

    <!-- СКРИПТ ОБРАБОТКИ ЗАГРУЗКИ -->
    <script>
        const uploadForm = document.getElementById('upload-form');
        const gamesContainer = document.getElementById('games-container');

        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('game-title').value;
            const desc = document.getElementById('game-desc').value;
            const fileInput = document.getElementById('game-file');
            const file = fileInput.files[0];

            if (file) {
                // Создаем локальную ссылку на загруженный файл
                const fileUrl = URL.createObjectURL(file);

                // Создаем карточку игры
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3 class="game-title">${title}</h3>
                    <p class="game-desc">${desc}</p>
                    <a href="${fileUrl}" download="${file.name}" class="btn-download-link">Скачать (${file.name})</a>
                `;

                // Добавляем карточку на страницу
                gamesContainer.prepend(card);

                // Очищаем форму
                uploadForm.reset();
                alert('Игра успешно добавлена!');
            }
        });
    </script>
</body>
</html>
